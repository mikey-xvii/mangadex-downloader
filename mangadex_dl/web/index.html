<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tankōbon</title>
  <meta name="theme-color" content="#0c0b10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='%23e23b2e'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23f3efe6' font-family='sans-serif' font-weight='900'%3E%E5%8D%98%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="tone" aria-hidden="true"></canvas>
  <div id="backdrop" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#/" aria-label="Tankōbon home">
      <span class="seal">単</span>
      <span class="word">TANK<span class="macron">Ō</span>BON</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="home">Find</a>
      <a href="#/library" data-nav="library">Shelf</a>
    </nav>
    <div class="top-actions">
      <button id="accountBtn" class="account-btn"></button>
    </div>
  </header>

  <main id="view"></main>

  <aside id="press" class="press" hidden></aside>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="reader" hidden></div>
  <div id="dropzone" aria-hidden="true"><div class="drop-inner"><span class="seal big">単</span><b>Drop to open</b><small>any MangaDex title or chapter link</small></div></div>

  <script type="module" src="/app.js"></script>
